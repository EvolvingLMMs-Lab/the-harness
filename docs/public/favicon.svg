<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>The Harness</title>
  <style>
    /* Every frame starts and ends at rest, so static favicon renderers show the full mark.
       The Simulator's beat: as its corners lock, the model plate comes down to the stack and floats clear again. */
    @media (prefers-reduced-motion: no-preference) {
      .model { animation: settle-model 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s 1 both; }
      .middle { animation: settle-middle 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s 1 both; }
    }
    @keyframes settle-model { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(2.8px); } 65% { transform: translateY(-0.9px); } }
    @keyframes settle-middle { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(0.8px); } 65% { transform: translateY(-0.3px); } }
  </style>
  <rect width="32" height="32" rx="7" fill="#f4f4f2"/>
  <rect x=".5" y=".5" width="31" height="31" rx="6.5" stroke="#2b2b2d" stroke-opacity=".12"/>
  <g stroke="#2b2b2d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 22 16 27 25 22"/>
    <path class="middle" d="M7 17 16 22 25 17"/>
    <path class="model" d="M16 5 25 10 16 15 7 10Z" fill="#2b2b2d"/>
  </g>
</svg>
