name: installers

# The desktop installers of a release (tag vX.Y.Z): Windows .exe and .msi, macOS .dmg (Apple
# silicon), Linux AppImage and .deb, each with its own Python runtime and the Harness wheel
# (tools/installers/build.py), added to the GitHub release that release.yml creates, with the
# shell updater's latest.json. The installers are not code-signed yet; the update bundles are
# signed with the Tauri updater's key when the repository has it:
#   secret   TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
#   variable TAURI_UPDATER_PUBKEY
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries of the shell
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Build the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: python tools/installers/build.py --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            packages/app/shell/src-tauri/target/*/release/bundle/nsis/*.exe*
            packages/app/shell/src-tauri/target/*/release/bundle/msi/*.msi*
            packages/app/shell/src-tauri/target/*/release/bundle/dmg/*.dmg
            packages/app/shell/src-tauri/target/*/release/bundle/macos/*.app.tar.gz*
            packages/app/shell/src-tauri/target/*/release/bundle/appimage/*.AppImage*
            packages/app/shell/src-tauri/target/*/release/bundle/deb/*.deb*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: latest.json for the shell's updater
        run: |
          python tools/installers/latest.py "${GITHUB_REF_NAME#v}" dist \
            --base "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}" --out dist/latest.json
      # release.yml creates the release once PyPI and npm have the version; wait for it.
      - name: Add the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 80); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 30; done
          gh release view "$GITHUB_REF_NAME" >/dev/null
          find dist -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.app.tar.gz' -o -name '*.sig' -o -name 'latest.json' \) -print0 \
            | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
