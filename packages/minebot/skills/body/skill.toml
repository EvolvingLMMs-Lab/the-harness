name = "body"
summary = "A bot body in a game: run code on the body through its own API (run_js), keep and run routines (save_routine, routine, read_routine, routine_versions, routines, drop_routine, stop_routines), read what it reports (get_state, body), look through its eyes (look), type in the game chat (chat)."
layer = "base"
mixin = "skills.body:Body"
exports = ["get_observation", "get_state", "show", "__wrap_up__", "run_js", "routine", "save_routine", "read_routine", "routine_versions", "routines", "drop_routine", "hazard", "route_rule", "drop_walking_rule", "avoid", "unavoid", "walking_rules", "code_running", "attempt", "start_over", "keep_start", "stop_routines", "body", "chat", "respawn"]
required = true
order = 0
embodiments = ["botbody"]

# The pages on how the body's libraries are used. Code runs on the body after the pages in FIRST were read.
[guides.body]
file = "guides/body.md"
before = ["run_js", "save_routine", "routine"]

