[package]
name = "harness-launcher"
version = "0.0.0"
description = "The harness command of The Harness desktop app on Windows: the app's bundled Python runs the harness"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "harness"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
