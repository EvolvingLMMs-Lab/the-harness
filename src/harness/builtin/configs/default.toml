# The agent: what `harness run` runs unless an experiment or --agent names another. It holds
# what is the same for every kind of environment. A kind's prompt and the agent's settings
# on it are its package's (kinds.toml: prompt, agent); without one, the prompt is the page
# every agent reads (prompts/core).
description = "The Harness: programs over the skills of the packages a task uses"
# The model roles (configs/models/<name>.toml); an experiment's `model` or --model NAME
# picks another.
model = "deepseek-flash"
roles = ["main", "vlm", "verifier"]

[runtime]
cell_timeout_seconds = 600
verifier = true
# Programs run isolated where the machine allows user namespaces.
isolation = "auto"

[budget]
max_model_calls = 60
